{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="head-title">
        <div class="left">
            <h1>Edit User Group</h1>
        </div>
    </div>
    <form method="POST">
        {% csrf_token %}
        <div class="table-data">
            <div class="row">
                {% for field in form %}
                    <div class="col-md-4">
                        <div class="form-group">
                            {{ field.label_tag }}
                            {{ field }}
                            {% if field.help_text %}
                                <small class="form-text text-muted">{{ field.help_text }}</small>
                            {% endif %}
                            {% for error in field.errors %}
                                <div class="invalid-feedback">{{ error }}</div>
                            {% endfor %}
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary update-btn">Update User Group</button>
        <a href="{% url 'dashboard:groupes' %}" class="btn btn-secondary cancel-btn">Cancel</a>
    </form>
</div>
{% endblock %}
