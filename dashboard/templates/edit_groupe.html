{% extends 'base.html' %}

{% block content %}
<div class="container">
  <h2>Edit Group</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    {% if form.errors %}
    <div class="alert alert-danger">
      <ul>
        {% for field in form %}
        {% for error in field.errors %}
        <li>{{ error }}</li>
        {% endfor %}
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    <button type="submit" class="btn btn-primary">Update Group</button>
    <a href="{% url 'dashboard:groupes' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
