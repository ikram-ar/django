{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="https://cdn.lineicons.com/3.0/lineicons.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}Logo{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Inline JavaScript to Apply Dark Mode Before Page Renders -->
    <script>
        // Check localStorage for dark mode preference
        const savedMode = localStorage.getItem('darkMode');
        if (savedMode === 'enabled') {
            // Apply dark mode by setting CSS variables directly
            document.documentElement.style.setProperty('--light', '#0C0C1E');
            document.documentElement.style.setProperty('--grey', '#060714');
            document.documentElement.style.setProperty('--dark', '#FBFBFB');
        }
    </script>
</head>
<body>


<!-- SIDEBAR -->
<section id="sidebar">
    <a href="#" class="brand">
        <i></i>
        <span class="text">Logo</span>
    </a>
    <ul class="side-menu top">
        <li class="{% if current_section == 'dashboard' %}active{% endif %}">
            <a href="{% url 'dashboard:home' %}">
                <i class='bx bxs-dashboard'></i>
                <span class="text">Dashboard</span>
            </a>
        </li>
        <li class="{% if current_section == 'etablissement' %}active{% endif %}">
            <a href="{% url 'dashboard:etablissement' %}">
                <i class='bx bxs-store'></i>
                <span class="text">Etablissement</span>
            </a>
        </li>
        <li class="{% if current_section == 'utilisateur' %}active{% endif %}">
            <a href="{% url 'dashboard:utilisateur' %}">
                <i class='bx bxs-user'></i>
                <span class="text">Utilisateur</span>
            </a>
        </li>
        <li class="{% if current_section == 'groupes' %}active{% endif %}">
            <a href="{% url 'dashboard:groupes' %}">
                <i class='bx bxs-group'></i>
                <span class="text">Groupes d'Utilisateurs</span>
            </a>
        </li>
    </ul>
    <ul class="side-menu">
        <li>
            <a href="{% url 'logout' %}" class="logout">
                <i class='bx bxs-log-out-circle'></i>
                <span class="text">Déconnexion</span>
            </a>
        </li>
    </ul>
</section>
<!-- SIDEBAR -->

<!-- CONTENT -->
<section id="content">
    <!-- NAVBAR -->
    <nav>
        <i class='bx bx-menu'></i>
        <form action="#" class="d-flex justify-content-start">
            <div class="form-input">
                
            </div>
        </form>

        <input type="checkbox" id="switch-mode" hidden>
        <label for="switch-mode" class="switch-mode"></label>
    </nav>
    <!-- NAVBAR -->

    <!-- MAIN CONTENT -->
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <!-- MAIN CONTENT -->
</section>
<!-- CONTENT -->

<script src="{% static 'js/script.js' %}"></script>

<!-- Inline JavaScript for Interactive Search Filtering with Bold Matching Text -->


<style>
    /* CSS for Enhanced Search Results Display with Bold Matching Text */
    
    a:hover {
        text-decoration: none;
    }
    .no-underline:hover {
        text-decoration: none;
    }
    
    
</style>

</body>
</html>
