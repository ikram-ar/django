{% extends 'base.html' %}

{% block content %}
<div class="head-title">
    <div class="left">
        <h1>Utilisateur</h1>
        <ul class="breadcrumb">
            <li>
                <a href="#">Utilisateur</a>
            </li>
            <li><i class='bx bx-chevron-right'></i></li>
            <li>
                <a class="active" href="#">Home</a>
            </li>
        </ul>
    </div>
</div>

<!-- Specific content for Utilisateur page -->
<div class="col-md-12">
    <span><a class="btn btn-primary">Add New User</a></span>  
    <div class="table-responsive">
        <table id="users_table" class="table table-striped table-bordered" width="100%">
            <thead>
                <th><input type="checkbox" id="checkall" /></th>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Edit</th>
                <th>Delete</th>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <td><input type="checkbox" class="checkthis" /></td>
                        <td>{{ user.id }}</td>
                        <td>{{ user.username }}</td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.phone_number }}</td>
                        <td><a  class="btn btn-primary">Edit</a></td>
                        <td><a  class="btn btn-danger">Delete</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<!-- Include DataTables CSS -->
<link href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css" rel="stylesheet">

<!-- Include jQuery and DataTables JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

<script>
    $(document).ready(function() {
        $('#users_table').DataTable();  // Initialize the DataTable for users
    });
</script>

<style>
    /* General table styling */
    .table {
        width: 100%;
        margin-bottom: 1rem;
        color: #212529;
        border-collapse: collapse;
    }

    /* Table header styling */
    .table thead th {
        vertical-align: bottom;
        border-bottom: 2px solid #dee2e6;
        background-color: #f8f9fa;
        text-align: center;
        padding: 10px;
        font-weight: bold;
    }

    /* Table body styling */
    .table tbody tr {
        border-top: 1px solid #dee2e6;
        text-align: center;
    }

    .table tbody tr:nth-of-type(odd) {
        background-color: #f2f2f2;
    }

    /* Hover effect for rows */
    .table tbody tr:hover {
        background-color: #e9ecef;
    }

    /* Table cell styling */
    .table tbody td {
        padding: 10px;
        vertical-align: middle;
    }

    /* Checkbox alignment */
    input[type="checkbox"] {
        margin: 0;
    }

    /* Button styling */
    .btn {
        padding: 5px 10px;
        font-size: 0.875rem;
        border-radius: 4px;
        text-align: center;
    }

    .btn-primary {
        color: #fff;
        background-color: #007bff;
        border-color: #007bff;
    }

    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #004085;
    }

    .btn-danger {
        color: #fff;
        background-color: #dc3545;
        border-color: #dc3545;
    }

    .btn-danger:hover {
        background-color: #c82333;
        border-color: #bd2130;
    }

    /* DataTables specific styling */
    #bootstrapdatatable {
        margin: 20px 0;
    }

    .dataTables_wrapper .dataTables_paginate .paginate_button {
        padding: 0.5em 1em;
        margin-left: 2px;
        background-color: #007bff;
        border: 1px solid #007bff;
        color: #fff;
        border-radius: 3px;
    }

    .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
        background-color: #0056b3;
        border-color: #004085;
    }

    .dataTables_wrapper .dataTables_filter input {
        border: 1px solid #dee2e6;
        border-radius: 3px;
        padding: 5px;
        margin-left: 10px;
    }
</style>

<!-- Specific content for Utilisateur page -->
{% endblock %}
